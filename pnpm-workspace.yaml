packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'

overrides:
  esbuild: '^0.25.0'
  vite: '^6.4.3'
  'brace-expansion@<1.1.17': '^1.1.17'

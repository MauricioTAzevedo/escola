name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escola_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/escola_test?schema=public"
      JWT_SECRET: "88fd230f399c1d7cae6b95894aa9de0fba3dac863b508ee0"
      JWT_REFRESH_SECRET: "3b7f7ff76160c11c7d3e9f8b11f16b312c0b9bb2101646cd"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run Build
        run: pnpm build

      - name: Prepare Database Schema
        run: pnpm --filter @escola/api exec prisma db push

      - name: Seed Test Database
        run: pnpm --filter @escola/api exec tsx prisma/seed.ts
        env:
          NODE_ENV: development

      - name: Run Tests
        run: pnpm test

      - name: Run Security Audit
        run: pnpm audit --audit-level=high

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-only-32-char-secret-0123456789abcdef"
      JWT_REFRESH_SECRET: "ci-only-refresh-32-char-secret-0123456789"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod || true

      - name: Prisma generate
        run: pnpm --filter @escola/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck & build
        run: pnpm build

      - name: Tests
        run: pnpm test
